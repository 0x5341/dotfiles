packages:
  - type: github_release
    repo_owner: "0x5341"
    repo_name: dv
    description: dev manager for me :)
    files:
      - name: dv
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        asset: dv_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
